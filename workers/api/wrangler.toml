name = "parthub-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "production"
JWT_EXPIRES_IN = "7d"
STOREFRONT_URL = "https://parthub.autos"
SELLER_PORTAL_URL = "https://seller.parthub.autos"
ADMIN_URL = "https://admin.parthub.autos"
WHATSAPP_TEMPLATE_LANG = "fr"
# Flat delivery fee added to every order, in centimes (3500 = 35 MAD).
SHIPPING_FEE_CENTIMES = "3500"

# Daily jobs (src/index.ts "scheduled"): commission ledger. 03:17 UTC.
[triggers]
crons = ["17 3 * * *", "*/15 * * * *"] # daily jobs; WhatsApp retries (src/index.ts)

[[d1_databases]]
binding = "DB"
database_name = "parthub-db"
database_id = "d0adb5e3-5e96-4bed-bbab-304b1e61fa91"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "parthub-media"

# Photo backup (infra/docs/operations-runbook.md §1): every upload is
# written here too; Admin > My account > Copy older photos fills it.
[[r2_buckets]]
binding = "MEDIA_BACKUP"
bucket_name = "parthub-media-backup"

#[[kv_namespaces]]
#binding = "KV"
#id = "REPLACE_WITH_YOUR_KV_ID"

[env.development]
name = "parthub-api-dev"
[env.development.vars]
APP_ENV = "development"

[env.staging]
name = "parthub-api-staging"
[env.staging.vars]
APP_ENV = "staging"
