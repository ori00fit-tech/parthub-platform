name: Deploy Pages

# Builds the three web apps and publishes them to Cloudflare Pages
# (direct upload, same as the manual `wrangler pages deploy` steps in
# deploy-notes.yml). Runs on every push to main that touches an app or a
# shared package, and can be run by hand: Actions → "Deploy Pages".

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to deploy"
        type: choice
        default: all
        options: [all, storefront, seller-portal, admin]

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public addresses. Set them as repository variables (Settings → Secrets
  # and variables → Actions → Variables) once the custom domains answer;
  # until then the Cloudflare default addresses are used.
  #   API_BASE_URL       e.g. https://api.parthub.autos
  #   SITE_URL           e.g. https://parthub.autos  (canonical address for
  #                      Google: canonical links, sitemap, robots.txt)
  #   SELLER_PORTAL_URL  e.g. https://seller.parthub.autos
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.parthub.autos' }}
  SITE_URL: ${{ vars.SITE_URL || '' }}
  SELLER_PORTAL_URL: ${{ vars.SELLER_PORTAL_URL || 'https://seller.parthub.autos' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pages project names in the Cloudflare account. Once a custom domain
          # is added to a project, it is also found by `domain`
          # (see .github/scripts/find-pages-project.mjs).
          - app: storefront
            package: "@parthub/storefront"
            domain: parthub.autos
            project: parthub-platform
          - app: seller-portal
            package: "@parthub/seller-portal"
            domain: seller.parthub.autos
            project: parthub-platform-seller
          - app: admin
            package: "@parthub/admin"
            domain: admin.parthub.autos
            project: parthub-platform-admin

    steps:
      - name: Skip apps not selected
        id: pick
        run: |
          wanted="${{ github.event.inputs.app || 'all' }}"
          if [ "$wanted" = "all" ] || [ "$wanted" = "${{ matrix.app }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.app }} (selected: $wanted)"
          fi

      - uses: actions/checkout@v4
        if: steps.pick.outputs.run == 'true'

      - name: Setup Node
        if: steps.pick.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22" # same as CI

      - name: Setup pnpm
        if: steps.pick.outputs.run == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        if: steps.pick.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }}
        if: steps.pick.outputs.run == 'true'
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITE_SELLER_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITE_ADMIN_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITE_SELLER_PORTAL_URL: ${{ env.SELLER_PORTAL_URL }}
          # Smaller photo copies (Cloudflare Image Transformations on the zone):
          # set the repository variable IMAGE_RESIZING to 1 once it is enabled.
          VITE_IMAGE_RESIZING: ${{ vars.IMAGE_RESIZING }}
        run: pnpm --filter "${{ matrix.package }}" build

      # The storefront's Pages Functions (SEO) read the API and canonical
      # addresses from functions/_lib/site.json.
      - name: Site addresses for the storefront functions
        if: steps.pick.outputs.run == 'true' && matrix.app == 'storefront'
        working-directory: apps/storefront
        run: |
          node -e 'require("fs").writeFileSync("functions/_lib/site.json", JSON.stringify({ apiBase: process.env.API_BASE_URL || "", siteUrl: process.env.SITE_URL || "" }, null, 2) + "\n")'
          cat functions/_lib/site.json

      - name: Check the build
        if: steps.pick.outputs.run == 'true'
        working-directory: apps/${{ matrix.app }}
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/_redirects || { echo "dist/_redirects missing: deep links would 404"; exit 1; }
          # Source maps aren't needed in production.
          find dist -name "*.map" -delete
          ls -la dist

      - name: Find the Pages project for ${{ matrix.domain }}
        id: project
        if: steps.pick.outputs.run == 'true'
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
        run: |
          read -r name source < <(node .github/scripts/find-pages-project.mjs "${{ matrix.domain }}" "${{ matrix.project }}")
          test -n "$name" || exit 1
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if [ "$source" != "upload" ]; then
            echo "::notice title=${{ matrix.app }}::$name is connected to $source, so Cloudflare builds and deploys it on every push by itself. Skipping the upload."
          fi

      - name: Deploy to Cloudflare Pages (${{ steps.project.outputs.name }})
        if: steps.pick.outputs.run == 'true' && steps.project.outputs.source == 'upload'
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
          CI: "true"
          # Passed through env so quotes in commit messages can't break the command.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual deploy' }}
          PROJECT_NAME: ${{ steps.project.outputs.name }}
        run: |
          npx --yes wrangler@4.152.0 pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-200)" \
            --commit-dirty=true
