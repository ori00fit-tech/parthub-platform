name: D1 migrations

# Run manually: GitHub → Actions → "D1 migrations" → Run workflow.
# Also runs before every API deploy (deploy-api.yml calls it).
# Applies the database migrations the API needs, against the production
# D1 database (parthub-db), using the same Cloudflare secrets as "Deploy API".
# Safe to run more than once: each migration is skipped if already applied.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    env:
      CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
      CI: "true"
      DB_NAME: parthub-db
      MIGRATIONS: ../../infra/d1/migrations

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # same as CI

      - name: Show tables before
        continue-on-error: true
        run: |
          npx --yes wrangler@4 d1 execute "$DB_NAME" --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"

      # File imports keep working even when D1's daily read limit is hit,
      # so no migration step depends on a read query. Steps that create
      # tables/indexes use IF NOT EXISTS; steps that add a column go through
      # d1-apply-add-column.sh, which treats "duplicate column" as done.

      - name: 0002 search logs table (create if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0002_search_engine.sql"

      - name: 0003 part requests (create tables if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0003_part_requests.sql"

      - name: 0004 WhatsApp notification log (create table if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0004_whatsapp_notifications.sql"

      - name: 0005 request photos (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0005_part_request_images.sql"

      - name: 0006 core indexes (create if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0006_core_indexes.sql"

      - name: 0007 sellers.seller_type (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0007_seller_type.sql"

      - name: 0008 parts.part_origin (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0008_part_origin.sql"

      - name: 0009 Morocco layer defaults and indexes
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0009_morocco_layer_backfill.sql"

      - name: 0010 parts.moderation_note (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0010_parts_moderation_note.sql"

      - name: 0011 sellers.moderation_note (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0011_sellers_moderation_note.sql"

      - name: 0012 stock alerts (create table if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0012_stock_alerts.sql"

      # Several columns in one file: each ADD COLUMN is applied on its own
      # (already there = done), then the rest of the file, which is safe to
      # run again.
      - name: 0013 legal acceptance (add columns if missing)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0013_legal_acceptance.sql"

      - name: 0014 order fulfilment by sellers (add columns, backfill, indexes)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0014_order_fulfillment.sql"

      - name: 0015 returns and claims (create table if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0015_order_issues.sql"

      - name: 0016 vehicle catalog (generations, engines, suggestions)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0016_vehicle_catalog.sql"

      # Morocco catalog data: INSERT OR IGNORE only, safe to run again.
      - name: 0017 vehicle catalog data (Morocco) and part brands
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0017_seed_vehicle_catalog.sql"

      - name: 0018 catalog quality (engine scope, data source, verification)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0018_catalog_quality.sql"

      - name: 0019 part numbers (OEM / aftermarket references)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0019_part_numbers.sql"

      - name: 0020 fulfilment methods (delivery, store pickup, courier)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0020_fulfillment_methods.sql"

      - name: 0021 session security (token version, sign-in attempts)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0021_session_security.sql"

      - name: 0022 delivery fees per seller, shipments with tracking
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0022_shipping_fees.sql"

      - name: 0023 commission ledger and platform settings
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0023_commissions.sql"

      - name: 0024 commission rules (dated rates, audit log, partial refunds)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0024_commission_rules.sql"

      - name: 0025 commission invoices and payments, buyer receipt
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0025_commission_invoices.sql"

      - name: 0026 carriers, shipment events, normalized shipment status
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0026_carriers.sql"

      - name: 0027 WhatsApp webhook (delivery statuses, contacts, inbox)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0027_whatsapp_webhook.sql"

      - name: 0028 WhatsApp templates (languages, Meta status), user language
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0028_whatsapp_templates.sql"

      - name: 0029 late shipments (delay notice)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0029_shipping_delays.sql"

      - name: 0030 duplicate-order guard (idempotency key, cart hash)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0030_order_guard.sql"

      - name: 0031 admin audit log
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0031_admin_audit_log.sql"

      - name: 0032 reliability (one pending order per cart, WhatsApp retries, carrier events)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0032_reliability.sql"

      - name: 0033 forgot password (codes and reset links)
        run: ../../.github/scripts/d1-apply-add-columns.sh "$MIGRATIONS/0033_password_resets.sql"

      # Fails the job (and the API deploy waiting for it) when the schema is
      # not what the API needs; only warns while D1's daily read limit is hit.
      - name: Verify
        run: ../../.github/scripts/d1-verify.sh
