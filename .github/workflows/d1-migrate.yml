name: D1 migrations

# Run manually: GitHub → Actions → "D1 migrations" → Run workflow.
# Applies the database migrations the API needs, against the production
# D1 database (parthub-db), using the same Cloudflare secrets as "Deploy API".
# Safe to run more than once: each migration is skipped if already applied.

on:
  workflow_dispatch:

concurrency:
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    env:
      CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
      CI: "true"
      DB_NAME: parthub-db
      MIGRATIONS: ../../infra/d1/migrations

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show tables before
        continue-on-error: true
        run: |
          npx --yes wrangler@4 d1 execute "$DB_NAME" --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"

      - name: 0003 part requests (create tables if missing)
        run: npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --file="$MIGRATIONS/0003_part_requests.sql"

      - name: 0004 WhatsApp notification log (create table if missing)
        run: npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --file="$MIGRATIONS/0004_whatsapp_notifications.sql"

      # File imports keep working even when D1's daily read limit is hit,
      # so no step below depends on a read query.
      - name: 0005 request photos (add column if missing)
        run: |
          set +e
          out=$(npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --file="$MIGRATIONS/0005_part_request_images.sql" 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -qi "duplicate column"; then
              echo "part_requests.images already exists — nothing to do"
            else
              exit $code
            fi
          fi

      - name: 0006 core indexes (create if missing)
        run: npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --file="$MIGRATIONS/0006_core_indexes.sql"

      # Read query: fails while the daily read limit is exceeded, which
      # doesn't mean the migrations failed.
      - name: Verify
        continue-on-error: true
        run: |
          npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --command \
            "SELECT
               (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('part_requests','request_offers','whatsapp_notifications')) AS new_tables_of_3,
               (SELECT CASE WHEN instr(sql, 'images') > 0 THEN 1 ELSE 0 END FROM sqlite_master WHERE type='table' AND name='part_requests') AS images_column,
               (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_part_images_part','idx_compat_part_id','idx_parts_seller_id','idx_parts_status')) AS key_indexes_of_4"
