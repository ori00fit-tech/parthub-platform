name: D1 migrations

# Run manually: GitHub → Actions → "D1 migrations" → Run workflow.
# Applies the database migrations the API needs, against the production
# D1 database (parthub-db), using the same Cloudflare secrets as "Deploy API".
# Safe to run more than once: each migration is skipped if already applied.

on:
  workflow_dispatch:

concurrency:
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    env:
      CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
      CI: "true"
      DB_NAME: parthub-db
      MIGRATIONS: ../../infra/d1/migrations

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show tables before
        continue-on-error: true
        run: |
          npx --yes wrangler@4 d1 execute "$DB_NAME" --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"

      # File imports keep working even when D1's daily read limit is hit,
      # so no migration step depends on a read query. Steps that create
      # tables/indexes use IF NOT EXISTS; steps that add a column go through
      # d1-apply-add-column.sh, which treats "duplicate column" as done.

      - name: 0002 search logs table (create if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0002_search_engine.sql"

      - name: 0003 part requests (create tables if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0003_part_requests.sql"

      - name: 0004 WhatsApp notification log (create table if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0004_whatsapp_notifications.sql"

      - name: 0005 request photos (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0005_part_request_images.sql"

      - name: 0006 core indexes (create if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0006_core_indexes.sql"

      - name: 0007 sellers.seller_type (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0007_seller_type.sql"

      - name: 0008 parts.part_origin (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0008_part_origin.sql"

      - name: 0009 Morocco layer defaults and indexes
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0009_morocco_layer_backfill.sql"

      - name: 0010 parts.moderation_note (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0010_parts_moderation_note.sql"

      - name: 0011 sellers.moderation_note (add column if missing)
        run: ../../.github/scripts/d1-apply-add-column.sh "$MIGRATIONS/0011_sellers_moderation_note.sql"

      - name: 0012 stock alerts (create table if missing)
        run: ../../.github/scripts/d1-exec-retry.sh --file="$MIGRATIONS/0012_stock_alerts.sql"

      # Read query: fails while the daily read limit is exceeded, which
      # doesn't mean the migrations failed.
      - name: Verify
        continue-on-error: true
        run: |
          npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --command \
            "SELECT
               (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('part_requests','request_offers','whatsapp_notifications','part_search_logs','stock_alerts')) AS tables_of_5,
               (SELECT CASE WHEN instr(sql, 'images') > 0 THEN 1 ELSE 0 END FROM sqlite_master WHERE type='table' AND name='part_requests') AS images_column,
               (SELECT CASE WHEN instr(sql, 'seller_type') > 0 THEN 1 ELSE 0 END FROM sqlite_master WHERE type='table' AND name='sellers') AS seller_type_column,
               (SELECT CASE WHEN instr(sql, 'part_origin') > 0 THEN 1 ELSE 0 END FROM sqlite_master WHERE type='table' AND name='parts') AS part_origin_column,
               (SELECT CASE WHEN instr(sql, 'moderation_note') > 0 THEN 1 ELSE 0 END FROM sqlite_master WHERE type='table' AND name='parts') AS parts_note_column,
               (SELECT CASE WHEN instr(sql, 'moderation_note') > 0 THEN 1 ELSE 0 END FROM sqlite_master WHERE type='table' AND name='sellers') AS sellers_note_column,
               (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_part_images_part','idx_compat_part_id','idx_parts_seller_id','idx_parts_status')) AS key_indexes_of_4"
