name: Deploy API

on:
  push:
    branches: [main]
    # The API, and what decides how it is deployed: its migrations and these
    # workflows (a change to them alone must also deploy, Nov 2026).
    paths:
      - 'workers/api/**'
      - 'infra/d1/schema.sql'
      - 'infra/d1/migrations/**'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/d1-migrate.yml'
      - '.github/scripts/d1-*'
  # By hand: Actions > Deploy API > Run workflow.
  workflow_dispatch:

jobs:
  # The database first: new code may read tables or columns that only the
  # latest migrations add (every step is safe to run again).
  migrate:
    uses: ./.github/workflows/d1-migrate.yml
    secrets: inherit

  deploy:
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # same as CI

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Exactly what CI tested: the lockfile, never a fresh resolution.
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: cd workers/api && npx wrangler@4 deploy
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
